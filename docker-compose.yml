# =========================================================================
# Agent OS v2.0 — docker-compose.yml (Linux / Pop!_OS)
# Hardware alvo: Ryzen 7 5700G + RTX 5050 8GB + 32GB RAM
# Ver ADR-0013 (Linux como plataforma de referência) e
# 09-INFRASTRUCTURE/Preparacao_Ambiente_Linux.md (pré-requisitos de host).
#
# CONVENÇÃO DE NOMES (ADR-0002, preservada do v0.1.1): cada serviço é
# nomeado pelo PAPEL que cumpre na arquitetura, não pela tecnologia
# específica — troca de motor (ex: chromadb -> outro vetorial) é uma
# mudança só neste arquivo, nenhuma referência no resto do sistema muda.
#
# LM Studio NÃO está neste compose de propósito: roda nativo no host
# (fora de container) para acesso direto ao driver da GPU sem
# complexidade de passthrough. O agent-os-api se conecta via
# LLM_ENDPOINT (ver .env.example) — no Linux, extra_hosts com
# host-gateway funciona nativamente (Docker Engine 20.10+), sem
# depender de nenhuma camada de compatibilidade extra.
#
# ESCOPO DESTA FASE: só os serviços que já têm código real por trás —
# agent-os-api e vector-db. automation (n8n), search (SearXNG),
# ocr-worker, transcription-worker e web-frontend ainda não foram
# reconstruídos na v2.0; entram aqui quando existirem de verdade, não
# antes — mesmo princípio já seguido na estrutura de pastas de
# documentação (nada de pasta vazia representando fase futura).
# =========================================================================

services:

  # -----------------------------------------------------------------
  # ANTES do primeiro `docker compose up`, crie as pastas de dados
  # com o seu próprio usuário: `mkdir -p data/sqlite data/vector-db`.
  # Sem isso, o Docker cria essas pastas como root no primeiro up, e o
  # usuário não-root do agent-os-api (agentos, uid 1000 — Dockerfile)
  # não consegue escrever no SQLite montado por bind mount, mesmo
  # tendo feito chown DENTRO da imagem (o bind mount usa a
  # propriedade da pasta do HOST, não da imagem). Ver
  # 09-INFRASTRUCTURE/Preparacao_Ambiente_Linux.md, seção de
  # troubleshooting.
  # -----------------------------------------------------------------

  # -----------------------------------------------------------------
  # Camada de API — envolve o LM Studio, nunca as Skills chamam o
  # LM Studio direto (Contrato_Interfaces.md). Isso é o que garante
  # que trocar de motor de LLM seja transparente para todo o resto.
  # -----------------------------------------------------------------
  agent-os-api:
    build:
      context: ./services/agent-os-api
      dockerfile: Dockerfile
    container_name: agent-os-api
    ports:
      - "8080:8080"
    environment:
      - LLM_ENDPOINT=${LLM_ENDPOINT}
      - LLM_API_KEY=${LLM_API_KEY}
      - DEFAULT_MODEL=${DEFAULT_MODEL}
      # CORREÇÃO v2.0: a v0.1.1 definia VECTOR_DB_URL aqui, mas
      # Settings (config.py) nunca teve esse campo — só
      # vector_db_host/vector_db_port. A variável nunca configurava
      # nada de verdade; só "funcionava" porque os valores padrão já
      # batiam por coincidência com nome/porta do serviço abaixo. Ver
      # ADR-0013 para o restante das correções desta reconstrução.
      - VECTOR_DB_HOST=vector-db
      - VECTOR_DB_PORT=8000
      - RELATIONAL_DB_PATH=/data/agent_os.db  # SQLite — arquivo, não serviço
      - LOG_LEVEL=INFO
    volumes:
      - ./data/sqlite:/data
    depends_on:
      - vector-db
    networks:
      - agent-os-net
    extra_hosts:
      - "host.docker.internal:host-gateway"   # alcança o LM Studio rodando no host

  # -----------------------------------------------------------------
  # Vector DB — papel: armazenar embeddings da base de conhecimento
  # (skill.rag_search, tool.chromadb_add — Fase 7).
  #
  # VERSÃO FIXADA DE PROPÓSITO (não usar :latest): o cliente Python
  # (chromadb==0.5.23 em requirements.txt) e o servidor PRECISAM estar
  # na mesma versão — o time do ChromaDB documenta mudanças que
  # quebram compatibilidade entre versões de cliente/servidor
  # (validação de tenant/database mudou entre a API v1 e v2). Usar
  # :latest faria o servidor evoluir sozinho e sair de sincronia com o
  # cliente fixado.
  # -----------------------------------------------------------------
  vector-db:
    image: chromadb/chroma:0.5.23
    container_name: vector-db
    ports:
      - "8000:8000"
    volumes:
      - ./data/vector-db:/chroma/chroma
    networks:
      - agent-os-net

networks:
  agent-os-net:
    driver: bridge